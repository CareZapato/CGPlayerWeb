version: '3.8'

services:
  # Base de datos PostgreSQL
  database:
    image: postgres:15-alpine
    container_name: cgplayer-db
    restart: always
    environment:
      POSTGRES_DB: cgplayerweb
      POSTGRES_USER: cgplayer
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cgplayer123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - cgplayer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgplayer -d cgplayerweb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para caché (opcional)
  redis:
    image: redis:7-alpine
    container_name: cgplayer-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - cgplayer-network
    volumes:
      - redis_data:/data

  # Aplicación principal (Frontend + Backend)
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: cgplayer-app
    restart: always
    environment:
      # Base de datos
      DATABASE_URL: postgresql://cgplayer:${DB_PASSWORD:-cgplayer123}@database:5432/cgplayerweb
      
      # JWT y seguridad
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      
      # Configuración del servidor
      NODE_ENV: production
      PORT: 3001
      
      # URLs y CORS - Auto-detecta IP local o usa fallback
      FRONTEND_URL: http://${SERVER_IP:-localhost}
      BACKEND_URL: http://${SERVER_IP:-localhost}:3001
      
      # IP del servidor (auto-detectada)
      SERVER_IP: ${SERVER_IP:-localhost}
      
      # Redis (opcional)
      REDIS_URL: redis://redis:6379
      
      # Configuración específica de producción
      LOG_LEVEL: info
      MAX_FILE_SIZE: 50MB
      
    ports:
      - "80:80"      # Frontend (Nginx)
      - "3001:3001"  # Backend API
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./logs:/app/logs
      - ./docker/wait-for-it.sh:/app/wait-for-it.sh:ro
    networks:
      - cgplayer-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx como proxy reverso (alternativa avanzada)
  nginx:
    image: nginx:alpine
    container_name: cgplayer-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - cgplayer-network
    depends_on:
      - app
    profiles:
      - proxy  # Solo se ejecuta con: docker-compose --profile proxy up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  cgplayer-network:
    driver: bridge
